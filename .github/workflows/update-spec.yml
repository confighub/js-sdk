name: Update ConfigHub spec

# Keep the generated clients at the latest ConfigHub release, automatically.
#
# Every hour (and on demand, or when the ConfigHub release workflow dispatches a
# `confighub-release` event), re-pin the spec at the latest confighub/sdk release.
# If that changed anything: commit it to main, compute the next version
# (X.Y = the spec's API version, Z = next patch; scripts/next-version.mjs), and
# publish through the release workflow. Nothing to review: the generated clients
# are a function of the spec, and the hand-written code is typechecked against
# them before anything is committed. A regenerated client that no longer
# typechecks fails here, loudly, and nothing is published.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'ConfigHub SDK version to pin to (default: latest release)'
        required: false
        type: string
  repository_dispatch:
    types: [confighub-release]

# id-token: the release workflow this calls publishes with npm provenance, and a
# called workflow cannot hold a permission its caller does not.
permissions:
  contents: write
  id-token: write

concurrency:
  group: update-spec
  cancel-in-progress: false

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Re-pin and regenerate
        env:
          SUMMARY_FILE: ${{ runner.temp }}/spec-update.md
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          scripts/update-spec.sh $VERSION
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit to main and pick the version
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the latest spec; nothing to publish."
            exit 0
          fi
          spec="$(cat .spec-version)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Pin the spec at ${spec}"
          git push origin main
          version="$(node scripts/next-version.mjs)"
          git tag "v${version}"
          git push origin "v${version}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pinned ${spec}; publishing ${version}" >> "$GITHUB_STEP_SUMMARY"

  # A tag pushed with GITHUB_TOKEN does not trigger the release workflow's own
  # push event, so it is called directly.
  publish:
    needs: repin
    if: needs.repin.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.repin.outputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
