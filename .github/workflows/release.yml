name: Release

# Publishes all three packages to npm at one version, with provenance.
#
# Two ways in:
#   - a `vX.Y.Z` tag pushed by hand (a hand-written change, e.g. to react-auth);
#   - the update-spec workflow, which re-pins the spec at each ConfigHub release
#     and calls this with the next version.
#
# Versions follow ConfigHub's own rule: X.Y is the API version the packages speak
# (the pinned spec's), Z increments on every publish. scripts/next-version.mjs
# computes it and refuses a tag that names a different API than the pinned spec.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (X.Y.Z, no v)'
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Resolve and check the version
        id: v
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          node scripts/next-version.mjs --check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (spec $(cat .spec-version))"

      - name: Set package versions
        run: |
          set -e
          VERSION="${{ steps.v.outputs.version }}"
          for pkg in @confighub/api @confighub/react-auth @confighub/rtk-query; do
            npm pkg set version="$VERSION" -w "$pkg"
          done
          # Keep the internal dependency in lockstep with this release.
          npm pkg set "dependencies.@confighub/api=^$VERSION" -w @confighub/react-auth

      - run: npm run build

      # Publishes every non-private workspace (the three packages; examples are private).
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
