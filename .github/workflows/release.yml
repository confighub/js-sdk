name: Release

# Publishes all three packages to npm, with provenance, when a `vX.Y.Z` tag is pushed.
#
# The tag is pushed by the ConfigHub server's release workflow, in the same push as the
# commit `ConfigHub vX.Y.Z` that copies the packages here at that release, sets their
# versions to `X.Y.Z`, and prepends the release's section to CHANGELOG.md. So there is
# nothing to compute here: check that the tag and the packages agree, build, publish,
# and make the GitHub release from that section.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag names the packages' version
        id: v
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in api react-auth rtk-query; do
            got="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::packages/$pkg is at $got, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run build

      # Publishes every non-private workspace: the three packages.
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # The notes are this version's section of CHANGELOG.md: from its heading to the
      # next version's.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
