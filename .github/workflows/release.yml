name: Release

# Tag-driven publish, matching the main codebase (v*.*.* tags). Push a semver tag
# and this publishes all three packages to npm at that version, with provenance.
#
#   npm run build        # sanity first
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The tag is the source of truth for the version — package.json versions in the repo
# are placeholders that CI overwrites at publish time.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Set versions from the tag
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"
          for pkg in @confighub/api @confighub/react-auth @confighub/rtk-query; do
            npm pkg set version="$VERSION" -w "$pkg"
          done
          # Keep the internal dependency in lockstep with this release.
          npm pkg set "dependencies.@confighub/api=^$VERSION" -w @confighub/react-auth

      - run: npm run build

      # Publishes every non-private workspace (the three packages; examples are private).
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
