name: Sync OpenAPI spec

# Bump the pinned ConfigHub server version and regenerate the typed client.
# Manually dispatched (optionally schedulable). It edits `.spec-version`, runs
# `sync-spec`, and if anything changed opens a PR with the regenerated
# `openapi.json` + `schema.d.ts` and a changeset, for human review before release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'confighub/sdk release tag to peg (e.g. v0.1.90). Blank keeps the current .spec-version.'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Set pinned version
        if: ${{ inputs.version != '' }}
        run: echo "${{ inputs.version }}" > .spec-version

      - name: Sync spec and regenerate types
        run: npm run sync-spec

      - name: Add changeset
        run: |
          VERSION=$(cat .spec-version)
          mkdir -p .changeset
          cat > .changeset/sync-spec-${VERSION}.md <<EOF
          ---
          '@confighub/api': minor
          ---

          Regenerate the typed client from ConfigHub spec ${VERSION}.
          EOF

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync-spec
          title: 'chore: sync OpenAPI spec'
          commit-message: 'chore: sync OpenAPI spec to pinned version'
          body: |
            Regenerated `@confighub/api` from the pinned spec in `.spec-version`.
            Review the `openapi.json` and `src/schema.d.ts` diff before merging.
