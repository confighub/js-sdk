# git-cliff configuration: CHANGELOG.md and release notes are generated from commit
# history at publish time (.github/workflows/release.yml). Commits follow
# `type(scope): subject`; see README "Commits".

[changelog]
# Must match the top of CHANGELOG.md exactly: with --prepend, git-cliff inserts
# the new section after this header rather than above it.
header = """
# Changelog

`@confighub/api`, `@confighub/react-auth` and `@confighub/rtk-query` publish together at one
version; `X.Y` names the ConfigHub API the packages were generated against (see README,
"Versions"). Sections from 0.4.5 on are generated from commit history by
[git-cliff](https://git-cliff.org) at publish time (`cliff.toml`); the same text is the
GitHub release's notes. An "API spec" entry is a re-pin to a new ConfigHub release and
lists what the generated surface gained or lost.

"""
# Rendered once per release section.
body = """
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "spec" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} **(breaking)**{% endif %}
{%- if commit.scope == "spec" and commit.body %}
{{ commit.body | trim | indent(prefix="  ", first=true) }}
{%- endif %}
{%- endfor %}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
# Commits from before this convention still appear, under "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
# Only the vX.Y.Z release tags, not the retired per-package ones.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^feat\\(spec\\)|^chore\\(spec\\)", group = "<!-- 0 -->API spec" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(chore|ci|build|refactor|test|perf|style)", group = "<!-- 4 -->Maintenance" },
  { message = ".*", group = "<!-- 5 -->Other" },
]
